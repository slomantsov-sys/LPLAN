<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Планировщик</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #0a0a0a; }
      #root { transform-origin: top left; }

      /* Mobile < 768px: NO scaling at all */

      /* Desktop 1200+: scale 1.5 (0.85 of 1.75) */
      @media (min-width: 1200px) {
        body {
          overflow-x: hidden;
        }
        #root {
          transform: scale(1.5);
          width: calc(100% / 1.5);
          min-height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
