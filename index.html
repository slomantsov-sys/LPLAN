<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Планировщик</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #0a0a0a; overscroll-behavior-y: none; }
      #root { width: 100%; min-height: 100vh; }
    </style>
    <script>
      // Apply scale BEFORE React renders to avoid flash
      (function() {
        var w = window.innerWidth;
        var scale = w >= 1200 ? 2.0 : w >= 768 ? 1.4 : 1;
        if (scale > 1) {
          document.addEventListener('DOMContentLoaded', function() {
            var root = document.getElementById('root');
            if (root) {
              root.style.transform = 'scale(' + scale + ')';
              root.style.transformOrigin = 'top left';
              root.style.width = (100 / scale) + 'vw';
              document.body.style.minHeight = (scale * 100) + 'vh';
            }
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
